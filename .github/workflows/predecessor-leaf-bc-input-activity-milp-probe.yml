name: predecessor-leaf B-C input activity MILP probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_bc_input_activity_milp.py'
      - '.github/workflows/predecessor-leaf-bc-input-activity-milp-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scipy
      - name: Reverify B/C first residue dependency
        run: python scripts/verify_v26_q138_predecessor_leaf_bc_first_dyadic_rank1160.py
      - name: Solve exact weighted B/C input activity MILPs
        run: python scripts/probe_v26_q138_predecessor_leaf_bc_input_activity_milp.py
