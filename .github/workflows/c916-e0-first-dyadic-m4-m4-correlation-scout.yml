name: C916 e0 m4-m4 correlation scout

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_m4_correlation_scout.py'
      - '.github/workflows/c916-e0-first-dyadic-m4-m4-correlation-scout.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Scout exact m4-m4 correlations
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_m4_m4_correlation_scout.py
