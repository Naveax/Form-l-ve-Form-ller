name: C916 minimax substituted full tree

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_minimax_substituted_full_tree.py'
      - 'scripts/probe_v26_q138_c916_bottleneck_parent_minimax_interval_dp.py'
      - 'scripts/probe_v26_q138_c916_evaluation_aware_recursive_tree_refined.py'
      - 'scripts/probe_v26_q138_c916_quadratic_function_space_separator.py'
      - '.github/workflows/c916-minimax-substituted-full-tree.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-minimax-substituted-full-tree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact minimax substituted full tree
        run: python scripts/probe_v26_q138_c916_minimax_substituted_full_tree.py
