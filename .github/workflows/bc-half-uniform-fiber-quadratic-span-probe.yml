name: B-C half uniform fiber-quadratic span probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_half_uniform_fiber_quadratic_span.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_HALF_UNIFORM_FIBER_QUADRATIC_SPAN_PROBE.md'
      - '.github/workflows/bc-half-uniform-fiber-quadratic-span-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-half-uniform-fiber-quadratic-span-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/probe_v26_q138_bc_half_uniform_fiber_quadratic_span.py
