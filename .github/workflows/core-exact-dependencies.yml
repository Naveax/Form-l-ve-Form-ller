name: Core exact algebra dependencies

on:
  push:
    paths:
      - '.github/workflows/core-exact-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-exact-dependencies-main
  cancel-in-progress: true

jobs:
  core-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair minimal-core certificate serialization if needed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/v26/recovered-bit-puncturing-dac/V26_QR_MINIMAL_CORE_WIDTH41_CERTIFICATE.json')
          s=p.read_text()
          try: json.loads(s); print('minimal certificate valid')
          except json.JSONDecodeError:
              stack=[];bad=[];ins=False;esc=False
              for i,ch in enumerate(s):
                  if ins:
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch=='"':ins=False
                      continue
                  if ch=='"':ins=True
                  elif ch in '[{':stack.append((ch,i))
                  elif ch in ']}':
                      ok=stack and ((stack[-1][0]=='[' and ch==']') or (stack[-1][0]=='{' and ch=='}'))
                      if ok:stack.pop()
                      else:assert ch==']';bad.append(i)
              assert not stack and bad
              fixed=''.join(ch for i,ch in enumerate(s) if i not in set(bad));obj=json.loads(fixed)
              assert obj['certificate']['max_boundary_dimension']==2**41
              p.write_text(fixed);print('removed unmatched closers',bad)
          PY
      - name: Repair rank528 verifier syntax if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify_v26_qr_width41_left_rank528.py');s=p.read_text()
          bad="M=[[Fraction(A[i][j]) for j in range(n)]+[Fraction(int(i==j)) for j in range(n)] for i in range(n)] for i in range(n)]"
          good="M=[[Fraction(A[i][j]) for j in range(n)]+[Fraction(int(i==j)) for j in range(n)] for i in range(n)]"
          if bad in s:
              s=s.replace(bad,good,1);p.write_text(s);print('rank528 syntax repaired')
          else:print('rank528 syntax already repaired')
          compile(p.read_text(),str(p),'exec')
          PY
      - name: Commit serialization/syntax repairs
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/v26/recovered-bit-puncturing-dac/V26_QR_MINIMAL_CORE_WIDTH41_CERTIFICATE.json scripts/verify_v26_qr_width41_left_rank528.py
            git commit -m 'Repair exact QR certificate/verifier serialization'
            git push
          fi
      - name: Verify minimal-core width41 certificate
        run: python scripts/verify_v26_qr_minimal_core_width41.py
      - name: Verify exact rank528 replacement
        run: python scripts/verify_v26_qr_width41_left_rank528.py
      - name: Verify width40 structural baseline
        run: python scripts/verify_v26_qr_q138_algebraic_width40.py
      - name: Verify left rank48
        run: python scripts/verify_v26_qr_q138_width40_left_rank48.py
      - name: Verify physical right hull162
        run: python scripts/verify_v26_qr_q138_physical_right_hull162.py
      - name: Verify physical rank envelope27 and common span47
        run: python scripts/verify_v26_qr_q138_physical_rank_envelope27.py
