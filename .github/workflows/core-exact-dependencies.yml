name: Core exact algebra dependencies

on:
  push:
    paths:
      - '.github/workflows/core-exact-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-exact-dependencies-main
  cancel-in-progress: true

jobs:
  core-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair unmatched closing brackets in minimal-core certificate serialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/v26/recovered-bit-puncturing-dac/V26_QR_MINIMAL_CORE_WIDTH41_CERTIFICATE.json')
          s=p.read_text()
          try:
              obj=json.loads(s); bad=[]
              print('minimal certificate already valid')
          except json.JSONDecodeError:
              stack=[];bad=[];ins=False;esc=False
              for i,ch in enumerate(s):
                  if ins:
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch=='"':ins=False
                      continue
                  if ch=='"':ins=True
                  elif ch in '[{':stack.append((ch,i))
                  elif ch in ']}':
                      ok=stack and ((stack[-1][0]=='[' and ch==']') or (stack[-1][0]=='{' and ch=='}'))
                      if ok:stack.pop()
                      else:
                          assert ch==']',(i,ch,stack[-5:])
                          bad.append(i)
              assert not stack,('unclosed after ignoring unmatched closers',stack[-10:])
              assert bad and all(3900<=i<=3960 for i in bad),bad
              drop=set(bad);fixed=''.join(ch for i,ch in enumerate(s) if i not in drop)
              obj=json.loads(fixed)
              assert obj['milestone']=='V26_QR_MINIMAL_CORE_WIDTH41_CERTIFICATE'
              assert obj['certificate']['leaves']==568
              assert obj['certificate']['internal_nodes']==567
              assert obj['certificate']['max_boundary_dimension']==2**41
              p.write_text(fixed)
              print('removed unmatched closing bracket positions',bad)
          PY
          if ! git diff --quiet -- research/v26/recovered-bit-puncturing-dac/V26_QR_MINIMAL_CORE_WIDTH41_CERTIFICATE.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/v26/recovered-bit-puncturing-dac/V26_QR_MINIMAL_CORE_WIDTH41_CERTIFICATE.json
            git commit -m 'Repair minimal-core width41 certificate JSON serialization'
            git push
          fi
      - name: Verify minimal-core width41 certificate
        run: python scripts/verify_v26_qr_minimal_core_width41.py
      - name: Verify exact rank528 replacement
        run: python scripts/verify_v26_qr_width41_left_rank528.py
      - name: Verify width40 structural baseline
        run: python scripts/verify_v26_qr_q138_algebraic_width40.py
      - name: Verify left rank48
        run: python scripts/verify_v26_qr_q138_width40_left_rank48.py
      - name: Verify physical right hull162
        run: python scripts/verify_v26_qr_q138_physical_right_hull162.py
      - name: Verify physical rank envelope27 and common span47
        run: python scripts/verify_v26_qr_q138_physical_rank_envelope27.py
