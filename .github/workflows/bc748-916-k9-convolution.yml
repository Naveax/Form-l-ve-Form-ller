name: B748-C916 k9 convolution

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_bc748_916_k9_convolution.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC748_916_K9_CONVOLUTION.md'
      - '.github/workflows/bc748-916-k9-convolution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc748-916-k9-convolution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify B748/C916 four-leaf convolution
        run: python scripts/verify_v26_q138_bc748_916_k9_convolution.py
