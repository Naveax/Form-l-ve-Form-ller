name: C916 worst-cut origin-fiber residual image

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_worst_cut_origin_fiber_residual_image.py'
      - 'scripts/probe_v26_q138_c916_quadratic_residual_separator.py'
      - 'scripts/probe_v26_q138_c916_aggregate_scalar_gauss_classes.py'
      - '.github/workflows/c916-worst-cut-origin-fiber-residual-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-worst-cut-origin-fiber-residual-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe worst-cut origin-fiber residual image
        run: python scripts/probe_v26_q138_c916_worst_cut_origin_fiber_residual_image.py
