name: C916 e0 first dyadic Gauss radical control

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_gauss_radical_control.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_gauss_radical_control_result.py'
      - 'scripts/probe_v26_q138_c916_e0_complete_first_dyadic_fiber_geometry.py'
      - 'scripts/probe_v26_q138_c916_e0_same_support_integer_coefficients.py'
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_pair_residual.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_E0_FIRST_DYADIC_GAUSS_RADICAL_CONTROL.md'
      - '.github/workflows/c916-e0-first-dyadic-gauss-radical-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-e0-first-dyadic-gauss-radical-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify first-dyadic Gauss radical controls
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_gauss_radical_control_result.py
