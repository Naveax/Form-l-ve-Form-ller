name: C916 evaluation-aware recursive tree

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_evaluation_aware_recursive_tree.py'
      - 'scripts/verify_v26_q138_c916_evaluation_aware_recursive_tree_result.py'
      - 'scripts/probe_v26_q138_c916_full_tree_evaluation_width.py'
      - 'scripts/probe_v26_q138_c916_quadratic_function_space_separator.py'
      - 'scripts/probe_v26_q138_c916_quadratic_residual_separator.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_EVALUATION_AWARE_RECURSIVE_TREE.md'
      - '.github/workflows/c916-evaluation-aware-recursive-tree.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-evaluation-aware-recursive-tree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify evaluation-aware recursive-tree result
        run: python scripts/verify_v26_q138_c916_evaluation_aware_recursive_tree_result.py
