name: C916 e0 base160 projection-disjoint activity

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_base160_projection_disjoint_activity.py'
      - '.github/workflows/c916-e0-first-dyadic-base160-projection-disjoint-activity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact base160 projection-disjoint activity graph
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_base160_projection_disjoint_activity.py
