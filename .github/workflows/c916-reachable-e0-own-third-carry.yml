name: C916 reachable e0 own third carry

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_reachable_e0_own_third_carry.py'
      - 'scripts/verify_v26_q138_c916_reachable_e0_own_third_carry_result.py'
      - 'scripts/probe_v26_q138_bc_e0_reachable_joint_sign_span.py'
      - 'scripts/probe_v26_q138_bc_uniform_half_lift_third_carry.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_bc_second_residue_sign_span348_432.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_REACHABLE_E0_OWN_THIRD_CARRY.md'
      - '.github/workflows/c916-reachable-e0-own-third-carry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-reachable-e0-own-third-carry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify C916 reachable e0 own third carry 1164
        run: python scripts/verify_v26_q138_c916_reachable_e0_own_third_carry_result.py
