name: B-C direct e2 signed sector exact Schmidt
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: bc-direct-e2-signed-sector-exact-schmidt-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_bc_direct_e2_signed_sector_exact_schmidt.py
