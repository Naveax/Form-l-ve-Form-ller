name: B-C e0 quadratic scalar refinement

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_e0_quadratic_scalar_refinement.py'
      - 'scripts/verify_v26_q138_bc_e0_quadratic_scalar_refinement_result.py'
      - 'scripts/probe_v26_q138_bc_e0_local_group_separator.py'
      - 'scripts/probe_v26_q138_bc_direct_e1_exact_sector_cancellation.py'
      - 'scripts/probe_v26_q138_bc_second_residue_fixed_predecessor_specialization.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_E0_QUADRATIC_SCALAR_REFINEMENT.md'
      - '.github/workflows/bc-e0-quadratic-scalar-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-e0-quadratic-scalar-refinement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/verify_v26_q138_bc_e0_quadratic_scalar_refinement_result.py
