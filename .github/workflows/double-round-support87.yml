name: Double-round nonlinear support87

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_double_round_support87.py'
      - '.github/workflows/double-round-support87.yml'
  workflow_dispatch:

jobs:
  support87:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify existing HT88 dependency
        run: python scripts/verify_v26_q138_double_round_leaf_ht95.py
      - name: Verify nonlinear support improvement
        run: python scripts/verify_v26_q138_double_round_support87.py
