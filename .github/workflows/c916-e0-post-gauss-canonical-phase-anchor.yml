name: C916 e0 post-Gauss canonical phase anchor

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_post_gauss_physical_phase_common.py'
      - 'scripts/probe_v26_q138_c916_e0_post_gauss_canonical_phase_anchor.py'
      - '.github/workflows/c916-e0-post-gauss-canonical-phase-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe post-Gauss canonical phase anchor
        run: python scripts/probe_v26_q138_c916_e0_post_gauss_canonical_phase_anchor.py
