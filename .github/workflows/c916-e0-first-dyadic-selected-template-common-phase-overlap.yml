name: C916 e0 selected-template common phase overlap

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_selected_template_common_phase_overlap.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_selected_template_common_phase_overlap_result.py'
      - '.github/workflows/c916-e0-first-dyadic-selected-template-common-phase-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify frozen selected-template common-phase overlap result
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_selected_template_common_phase_overlap_result.py
