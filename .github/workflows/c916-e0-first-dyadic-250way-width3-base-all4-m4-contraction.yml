name: C916 e0 width3-base all4-m4 contraction

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_width3_base_all4_m4_contraction.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-width3-base-all4-m4-contraction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Download frozen PR203 base authority
        uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          path: authorities/base
      - name: Download frozen PR201 m4 authority
        uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          path: authorities/m4
      - name: Contract exact width3 base marginal with all-four m4 factor
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_width3_base_all4_m4_contraction.py
