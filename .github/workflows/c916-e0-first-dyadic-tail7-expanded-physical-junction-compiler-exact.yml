name: C916 E0 tail7 expanded physical junction compiler exact

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_tail7_expanded_physical_treewidth8_exact.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_tail7_expanded_physical_junction_compiler_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-tail7-expanded-physical-junction-compiler-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check tail7 treewidth verifier
        run: python -m py_compile scripts/verify_v26_q138_c916_e0_first_dyadic_tail7_expanded_physical_treewidth8_exact.py
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-tail7-quotient-*
          run-id: 35611538356
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail7-quotient
          merge-multiple: true
      - name: Prove exact tail7-expanded physical treewidth 8
        env:
          C916_TAIL7_QUOTIENT_DIR: authorities/tail7-quotient
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_tail7_expanded_physical_treewidth8_exact.py

  verify:
    needs: topology
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Syntax-check tail7 junction compiler
        run: python -m py_compile scripts/verify_v26_q138_c916_e0_first_dyadic_tail7_expanded_physical_junction_compiler_exact.py
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tail3-quotient-*
          run-id: 35120066130
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail3-quotient
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-tail4-quotient-*
          run-id: 35333500851
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail4-quotient
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-tail5-quotient-*
          run-id: 35571898114
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail5-quotient
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-tail6-quotient-*
          run-id: 35587544692
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail6-quotient
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-tail7-quotient-*
          run-id: 35611538356
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail7-quotient
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Compile exact tail7-expanded physical junction layer
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
          C916_TAIL3_QUOTIENT_DIR: authorities/tail3-quotient
          C916_TAIL4_QUOTIENT_DIR: authorities/tail4-quotient
          C916_TAIL5_QUOTIENT_DIR: authorities/tail5-quotient
          C916_TAIL6_QUOTIENT_DIR: authorities/tail6-quotient
          C916_TAIL7_QUOTIENT_DIR: authorities/tail7-quotient
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_tail7_expanded_physical_junction_compiler_exact.py
