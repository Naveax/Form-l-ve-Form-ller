name: C916 e0 all-577 exact phase template cover

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_all_577_exact_template_cover.py'
      - '.github/workflows/c916-e0-first-dyadic-all-577-exact-template-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact all-577 phase template cover
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_all_577_exact_template_cover.py
