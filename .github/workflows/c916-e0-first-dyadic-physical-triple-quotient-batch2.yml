name: C916 e0 physical triple quotient batch2

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_physical_triple_quotient_batch2.py'
      - '.github/workflows/c916-e0-first-dyadic-physical-triple-quotient-batch2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-target:
    strategy:
      fail-fast: false
      matrix:
        target: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Freeze second-batch exact physical ternary quotient relation
        env:
          C916_PHYSICAL_QUOTIENT_BATCH2_TARGET: ${{ matrix.target }}
          C916_PHYSICAL_TRIPLE_MAX_CELLS: '50000'
          C916_PHYSICAL_TRIPLE_MAX_PHASES: '14'
          C916_PHYSICAL_TRIPLE_MAX_WALSH_EVALS: '2000000'
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_physical_triple_quotient_batch2.py
