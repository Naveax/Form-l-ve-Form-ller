name: C916 left parent exact minimax60 certificate

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_left_parent_exact_minimax60_certificate.py'
      - 'scripts/verify_v26_q138_c916_left_parent_exact_minimax60_certificate_result.py'
      - 'scripts/probe_v26_q138_c916_left_parent_threshold59_dp.py'
      - 'scripts/verify_v26_q138_c916_left_parent_threshold59_dp_result.py'
      - 'scripts/probe_v26_q138_c916_evaluation_aware_recursive_tree_refined.py'
      - 'scripts/probe_v26_q138_c916_quadratic_function_space_separator.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_LEFT_PARENT_EXACT_MINIMAX60.md'
      - '.github/workflows/c916-left-parent-exact-minimax60.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-left-parent-exact-minimax60-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify exact fixed-order minimax width60
        run: python scripts/verify_v26_q138_c916_left_parent_exact_minimax60_certificate_result.py
