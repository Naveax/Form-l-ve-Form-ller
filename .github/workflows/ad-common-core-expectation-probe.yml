name: A-D common-core expectation probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_ad_third_common_core_expectation.py'
      - '.github/workflows/ad-common-core-expectation-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_ad_third_common_core_expectation.py
