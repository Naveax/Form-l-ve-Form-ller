name: Signed explicit local factors

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_signed_block1_explicit_factor.py'
      - 'scripts/verify_v26_q138_signed_block2_explicit_factor.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_SIGNED_BLOCK1_EXPLICIT_FACTOR_THEOREM.md'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_SIGNED_BLOCK2_EXPLICIT_FACTOR_THEOREM.md'
      - '.github/workflows/signed-explicit-local-factors.yml'
  workflow_dispatch:

jobs:
  explicit-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify block1 explicit rank16 factor
        run: python scripts/verify_v26_q138_signed_block1_explicit_factor.py
      - name: Verify block2 explicit rank2784 factor
        run: python scripts/verify_v26_q138_signed_block2_explicit_factor.py
