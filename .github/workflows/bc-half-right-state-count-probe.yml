name: B-C half right state count probe
on: [workflow_dispatch, push]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_bc_half_right_state_count.py
