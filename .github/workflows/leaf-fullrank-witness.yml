name: Leaf full-rank witness search

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_leaf_fullrank_witness.py'
      - '.github/workflows/leaf-fullrank-witness.yml'
  workflow_dispatch:

concurrency:
  group: leaf-fullrank-main
  cancel-in-progress: true

jobs:
  leaf-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy opt_einsum python-flint
      - name: Verify current HT88 dependency
        run: python scripts/verify_v26_q138_double_round_leaf_ht95.py
      - run: python scripts/verify_v26_q138_leaf_fullrank_witness.py
