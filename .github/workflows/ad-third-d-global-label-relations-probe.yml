name: A-D third D global label relations probe
on:
  push:
    paths:
      - 'scripts/probe_v26_q138_ad_third_d_global_label_relations.py'
      - '.github/workflows/ad-third-d-global-label-relations-probe.yml'
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_ad_third_d_global_label_relations.py'
      - '.github/workflows/ad-third-d-global-label-relations-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_ad_third_d_global_label_relations.py
