name: Leaf S1 sliced column-block path probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_leaf_s1_*.py'
      - 'scripts/verify_v26_q138_leaf_*.py'
      - '.github/workflows/leaf-s1-sliced-column-blocks.yml'
  workflow_dispatch:
concurrency:
  group: leaf-s1-sliced-column-blocks-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy opt_einsum
      - name: Reverify leaf cut topology
        run: python scripts/verify_v26_q138_leaf_terminal_cut11_falsifier.py
      - name: Plan sliced row-column blocks
        run: python scripts/probe_v26_q138_leaf_s1_sliced_column_blocks.py
