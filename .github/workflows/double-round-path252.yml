name: Double-round path252 verifier

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_double_round_path252.py'
      - '.github/workflows/double-round-path252.yml'
  workflow_dispatch:

jobs:
  path252:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_q138_double_round_path252.py
