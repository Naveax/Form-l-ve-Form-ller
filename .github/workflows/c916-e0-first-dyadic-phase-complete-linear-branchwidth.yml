name: C916 e0 first-dyadic phase-complete linear branchwidth

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_linear_branchwidth.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_phase_complete_linear_branchwidth_result.py'
      - '.github/workflows/c916-e0-first-dyadic-phase-complete-linear-branchwidth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify frozen dual-kernel branchwidth result
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_phase_complete_linear_branchwidth_result.py
