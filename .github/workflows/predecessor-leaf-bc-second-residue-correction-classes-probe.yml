name: predecessor-leaf B-C second residue correction classes probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_correction_classes.py'
      - '.github/workflows/predecessor-leaf-bc-second-residue-correction-classes-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe correction classes in the top 4D quotient
        run: python scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_correction_classes.py
