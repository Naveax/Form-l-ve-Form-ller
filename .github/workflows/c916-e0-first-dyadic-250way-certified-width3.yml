name: C916 e0 250-way certified width3 CSP

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_certified_width3.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-certified-width3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact certified width-3 250-way CSP candidates
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_certified_width3.py
