name: Exact mathematics verifiers

on:
  push:
    paths:
      - 'scripts/verify_v26_qr_q138_mask_coeff124_tt.py'
      - 'scripts/verify_v26_qr_q138_mask_to_u47_coeff_tensor.py'
      - '.github/workflows/exact-math-verifiers.yml'
  workflow_dispatch:

jobs:
  mask-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify width40 baseline parses and passes
        run: python scripts/verify_v26_qr_q138_algebraic_width40.py
      - name: Verify exact mask coefficient span and TT profile
        run: python scripts/verify_v26_qr_q138_mask_coeff124_tt.py
