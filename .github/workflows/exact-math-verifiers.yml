name: Exact mathematics verifiers

on:
  push:
    paths:
      - 'scripts/verify_v26_qr_q138_mask_to_u47_coeff_tensor.py'
      - '.github/workflows/exact-math-verifiers.yml'
  workflow_dispatch:

jobs:
  mask-to-u47:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact mask-to-U47 coefficient tensor
        run: python scripts/verify_v26_qr_q138_mask_to_u47_coeff_tensor.py
