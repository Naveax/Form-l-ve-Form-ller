name: A-D third direct e2 input quotient
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_ad_third_direct_e2_input_quotient.py'
      - 'research/v26/recovered-bit-puncturing-dac/VERIFY_AD_THIRD_E2_MILP_TRIGGER.txt'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_ad_third_direct_e2_input_quotient.py
