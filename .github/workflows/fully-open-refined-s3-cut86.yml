name: Fully-open refined S3 cut86

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_fully_open_refined_s3_cut86.py'
      - '.github/workflows/fully-open-refined-s3-cut86.yml'
  workflow_dispatch:

jobs:
  refined-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify refined fully-open S3 cut
        run: python scripts/verify_v26_q138_fully_open_refined_s3_cut86.py
