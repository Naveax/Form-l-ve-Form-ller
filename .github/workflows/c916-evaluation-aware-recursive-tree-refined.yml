name: C916 evaluation-aware recursive tree refined

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_evaluation_aware_recursive_tree_refined.py'
      - 'scripts/probe_v26_q138_c916_full_tree_evaluation_width.py'
      - 'scripts/verify_v26_q138_c916_width64_quadratic_edge_all_fiber_image_result.py'
      - '.github/workflows/c916-evaluation-aware-recursive-tree-refined.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-evaluation-aware-recursive-tree-refined-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe refined evaluation-aware recursive tree
        run: python scripts/probe_v26_q138_c916_evaluation_aware_recursive_tree_refined.py
