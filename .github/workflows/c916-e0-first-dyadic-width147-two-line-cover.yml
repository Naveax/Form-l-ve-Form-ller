name: C916 e0 first-dyadic width147 two-line cover

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_width147_two_line_cover.py'
      - '.github/workflows/c916-e0-first-dyadic-width147-two-line-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-width147-two-line-cover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact two-direction global cover
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_width147_two_line_cover.py
