name: C uniform second residue basis gauge fast probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c_uniform_second_residue_basis_gauge_fast.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C_UNIFORM_SECOND_RESIDUE_BASIS_GAUGE_FAST_PROBE.md'
      - '.github/workflows/c-uniform-second-residue-basis-gauge-fast-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c-uniform-second-residue-basis-gauge-fast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/probe_v26_q138_c_uniform_second_residue_basis_gauge_fast.py
