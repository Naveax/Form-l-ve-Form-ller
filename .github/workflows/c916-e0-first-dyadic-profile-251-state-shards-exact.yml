name: C916 E0 profile 251 weighted state shards exact

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_state_shard_exact.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_context_exact.py'
      - 'scripts/_c916_all_current_weighted_context_engine.py'
      - '.github/workflows/c916-e0-first-dyadic-profile-251-state-shards-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  shard:
    name: profile-251-shard-${{ matrix.shard_index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard_index: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check exact shard runner
        run: >-
          python -m py_compile
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_state_shard_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_context_exact.py
          scripts/_c916_all_current_weighted_context_engine.py
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - name: Exact weighted profile 251 state shard ${{ matrix.shard_index }}
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_state_shard_exact.py
          shard
          --shard-index ${{ matrix.shard_index }}
          --output authorities/profile-251-shards/profile-251-shard-${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-all-current-weighted-profile-251-shard-${{ matrix.shard_index }}
          path: authorities/profile-251-shards/profile-251-shard-${{ matrix.shard_index }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: aggregate-profile-251-shards
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check exact shard aggregate
        run: python -m py_compile scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_state_shard_exact.py
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-all-current-weighted-profile-251-shard-*
          path: authorities/profile-251-shards
          merge-multiple: true
      - name: Aggregate exact profile 251 state shards
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_state_shard_exact.py
          aggregate
          --directory authorities/profile-251-shards
          --output authorities/c916-all-current-weighted-profile-251-state-shards-exact.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-all-current-weighted-profile-251-state-shards-exact
          path: authorities/c916-all-current-weighted-profile-251-state-shards-exact.json
          if-no-files-found: error
          retention-days: 14
