name: C916 e0 m4-m4 nonzero-correlation joint images

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_m4_nonzero_correlation_joint_images.py'
      - '.github/workflows/c916-e0-first-dyadic-m4-m4-nonzero-correlation-joint-images.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact eight-term m4-m4 joint images
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_m4_m4_nonzero_correlation_joint_images.py
