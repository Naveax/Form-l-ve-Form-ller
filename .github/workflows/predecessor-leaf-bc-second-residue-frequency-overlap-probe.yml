name: predecessor-leaf B-C second residue frequency overlap probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_frequency_overlap.py'
      - '.github/workflows/predecessor-leaf-bc-second-residue-frequency-overlap-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe second-residue frequency overlap
        run: python scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_frequency_overlap.py
