name: k7 A-D-only no-go gate
on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_k7_ad_only_no_go_gate.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_K7_AD_ONLY_NO_GO_GATE.md'
      - 'research/v26/recovered-bit-puncturing-dac/VERIFY_K7_AD_ONLY_NO_GO_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_q138_k7_ad_only_no_go_gate.py
