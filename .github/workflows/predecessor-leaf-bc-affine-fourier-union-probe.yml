name: predecessor-leaf B-C affine Fourier union probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_bc_affine_fourier_union.py'
      - '.github/workflows/predecessor-leaf-bc-affine-fourier-union-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reverify B/C input-activity no-gain dependency
        run: python scripts/verify_v26_q138_predecessor_leaf_bc_input_activity_no_gain.py
      - name: Probe B/C affine Fourier unions
        run: python scripts/probe_v26_q138_predecessor_leaf_bc_affine_fourier_union.py
