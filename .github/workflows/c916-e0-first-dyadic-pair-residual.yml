name: C916 e0 first dyadic pair residual

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_pair_residual.py'
      - 'scripts/probe_v26_q138_c916_e0_same_support_integer_coefficients.py'
      - 'scripts/verify_v26_q138_c916_e0_same_support_integer_coefficients_result.py'
      - 'scripts/probe_v26_q138_bc_e0_quadratic_scalar_refinement.py'
      - 'scripts/probe_v26_q138_bc_direct_e1_exact_sector_cancellation.py'
      - '.github/workflows/c916-e0-first-dyadic-pair-residual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-e0-first-dyadic-pair-residual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact first dyadic pair residual
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_pair_residual.py
