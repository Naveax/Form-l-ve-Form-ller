name: B-C e0 reachable joint second lift 812-952

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_e0_reachable_joint_sign_span.py'
      - 'scripts/verify_v26_q138_bc_e0_reachable_joint_second_lift812_952.py'
      - '.github/workflows/bc-e0-reachable-joint-second-lift812-952.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/verify_v26_q138_bc_e0_reachable_joint_second_lift812_952.py
