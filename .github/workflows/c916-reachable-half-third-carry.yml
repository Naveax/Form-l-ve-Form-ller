name: C916 reachable half third carry

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_reachable_half_third_carry.py'
      - 'scripts/probe_v26_q138_bc_e0_reachable_half_relaxed_zz.py'
      - 'scripts/probe_v26_q138_bc_uniform_half_lift_third_carry.py'
      - 'scripts/probe_v26_q138_bc_canonical_e0_half_third_carry_degree4.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_REACHABLE_HALF_THIRD_CARRY.md'
      - '.github/workflows/c916-reachable-half-third-carry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-reachable-half-third-carry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe C916 reachable-gauge half carry
        run: python scripts/probe_v26_q138_c916_reachable_half_third_carry.py
