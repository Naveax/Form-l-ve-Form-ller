name: C916 e0 m4 support-stratified joint candidates

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_support_stratified_joint_candidates.py'
      - '.github/workflows/c916-e0-first-dyadic-m4-support-stratified-joint-candidates.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact support-stratified parent by m4 joint images
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_m4_support_stratified_joint_candidates.py
