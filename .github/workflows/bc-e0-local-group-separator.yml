name: B-C e0 local-group separator diagnostic

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_e0_local_group_separator.py'
      - 'scripts/probe_v26_q138_bc_half_uniform_linear_state_relaxed_scalar.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_bc_second_residue_sign_span348_432.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_E0_LOCAL_GROUP_SEPARATOR.md'
      - '.github/workflows/bc-e0-local-group-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-e0-local-group-separator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/probe_v26_q138_bc_e0_local_group_separator.py
