name: B-C e0 sign Q-rank minor probe
on: [workflow_dispatch, push]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet python-flint
      - run: python scripts/probe_v26_q138_predecessor_leaf_bc_e0_sign_qrank_minor.py
