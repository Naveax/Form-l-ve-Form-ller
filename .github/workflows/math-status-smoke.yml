name: Math status smoke
on:
  push:
    paths:
      - '.github/workflows/math-status-smoke.yml'
permissions:
  contents: read
  statuses: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Publish smoke status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='math/status-smoke' -f description='PASS exact-math status bridge'
