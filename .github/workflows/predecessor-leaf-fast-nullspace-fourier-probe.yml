name: predecessor-leaf fast nullspace Fourier probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_fast_nullspace_fourier.py'
      - '.github/workflows/predecessor-leaf-fast-nullspace-fourier-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fast quotient Fourier probes
        run: python scripts/probe_v26_q138_predecessor_leaf_fast_nullspace_fourier.py
