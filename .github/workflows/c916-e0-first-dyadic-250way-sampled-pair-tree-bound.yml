name: C916 e0 250-way sampled pair tree bound

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_sampled_pair_tree_bound.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-sampled-pair-tree-bound.yml'
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_singleton_m2_160way_joint_tree_bound.py'
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_support_stratified_joint_candidates.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Bound exact sampled 250-way pair tree
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_sampled_pair_tree_bound.py
