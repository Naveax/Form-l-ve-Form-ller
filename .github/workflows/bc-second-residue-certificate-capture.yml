name: B-C second residue certificate capture
on:
  push:
    paths:
      - '.github/workflows/bc-second-residue-certificate-capture.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact finite certificates
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            python scripts/verify_v26_q138_predecessor_leaf_bc_half_correction_uniform_rank252_280.py
            python scripts/probe_v26_q138_bc_e0_correction_uniform_left_span.py
          } | tee research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_SECOND_RESIDUE_CAPTURE.txt
      - name: Commit certificate output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_SECOND_RESIDUE_CAPTURE.txt
          git commit -m 'Capture B-C second-residue certificate output'
          git push
