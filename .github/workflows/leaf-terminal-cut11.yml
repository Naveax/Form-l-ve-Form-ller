name: Leaf terminal cut11 falsifier

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_leaf_terminal_cut11_falsifier.py'
      - '.github/workflows/leaf-terminal-cut11.yml'
  workflow_dispatch:

jobs:
  leaf-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_q138_leaf_terminal_cut11_falsifier.py
