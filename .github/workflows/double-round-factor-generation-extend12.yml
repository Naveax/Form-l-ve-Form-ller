name: Factor generation from block2 extend12

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_signed_block2_extend12_rank21888.py'
      - 'scripts/verify_v26_q138_double_round_factor_generation_extend12.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_SIGNED_BLOCK2_EXTEND12_RANK21888_THEOREM.md'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_DOUBLE_ROUND_FACTOR_GENERATION_EXTEND12_THEOREM.md'
      - '.github/workflows/double-round-factor-generation-extend12.yml'
  workflow_dispatch:

jobs:
  factor-gen-extend12:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact rank21888 dependency
        run: python scripts/verify_v26_q138_signed_block2_extend12_rank21888.py
      - name: Verify factor-generation ledger
        run: python scripts/verify_v26_q138_double_round_factor_generation_extend12.py
