name: B-C direct e1 signed frequency zero predecessor
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: bc-direct-e1-signed-frequency-zero-predecessor-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_bc_direct_e1_signed_frequency_zero_predecessor.py
