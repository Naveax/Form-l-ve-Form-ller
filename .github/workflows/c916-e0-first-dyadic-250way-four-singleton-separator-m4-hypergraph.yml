name: C916 e0 four-singleton separator m4 hypergraph

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_four_singleton_separator_m4_hypergraph.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-four-singleton-separator-m4-hypergraph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact four-singleton separator m4 hypergraph coupling
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_four_singleton_separator_m4_hypergraph.py
