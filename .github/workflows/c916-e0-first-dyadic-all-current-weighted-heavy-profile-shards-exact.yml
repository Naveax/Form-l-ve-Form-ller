name: C916 E0 all-current weighted heavy-profile shards exact

on:
  workflow_dispatch:
    inputs:
      domain_state_sum:
        description: Heavy separator-domain profile
        required: true
        type: choice
        options:
          - '251'
          - '288'
          - '302'
      split_depth:
        description: Deterministic exact split depth
        required: true
        type: choice
        default: '2'
        options:
          - '1'
          - '2'
          - '3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.domain_state_sum }}-${{ inputs.split_depth }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shard_indices: ${{ steps.shards.outputs.indices }}
      manifest_digest: ${{ steps.shards.outputs.digest }}
      leaf_count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check exact shard runner
        run: >-
          python -m py_compile
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_weighted_heavy_profile_shards_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_context_exact.py
          scripts/_c916_all_current_weighted_context_engine.py
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - name: Build exact shard manifest
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_weighted_heavy_profile_shards_exact.py
          manifest
          --domain-state-sum ${{ inputs.domain_state_sum }}
          --split-depth ${{ inputs.split_depth }}
          --output authorities/heavy-profile/manifest.json
      - id: shards
        name: Freeze shard index matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          row = json.loads(Path('authorities/heavy-profile/manifest.json').read_text())
          print('indices=' + json.dumps(list(range(int(row['leaf_count']))), separators=(',', ':')))
          print('digest=' + str(row['manifest_digest_sha256']))
          print('count=' + str(row['leaf_count']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c916-heavy-profile-${{ inputs.domain_state_sum }}-depth${{ inputs.split_depth }}-manifest
          path: authorities/heavy-profile/manifest.json
          if-no-files-found: error
          retention-days: 14

  shard:
    needs: manifest
    name: shard-${{ matrix.shard_index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard_index: ${{ fromJSON(needs.manifest.outputs.shard_indices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - name: Count exact heavy-profile shard ${{ matrix.shard_index }}
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_weighted_heavy_profile_shards_exact.py
          shard
          --domain-state-sum ${{ inputs.domain_state_sum }}
          --split-depth ${{ inputs.split_depth }}
          --shard-index ${{ matrix.shard_index }}
          --output authorities/heavy-profile/shard-${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-heavy-profile-${{ inputs.domain_state_sum }}-depth${{ inputs.split_depth }}-shard-${{ matrix.shard_index }}
          path: authorities/heavy-profile/shard-${{ matrix.shard_index }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [manifest, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c916-heavy-profile-${{ inputs.domain_state_sum }}-depth${{ inputs.split_depth }}-manifest
          path: authorities/heavy-profile
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-heavy-profile-${{ inputs.domain_state_sum }}-depth${{ inputs.split_depth }}-shard-*
          path: authorities/heavy-profile/shards
          merge-multiple: true
      - name: Aggregate exact heavy-profile shards
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_weighted_heavy_profile_shards_exact.py
          aggregate
          --manifest authorities/heavy-profile/manifest.json
          --directory authorities/heavy-profile/shards
          --output authorities/heavy-profile/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-heavy-profile-${{ inputs.domain_state_sum }}-depth${{ inputs.split_depth }}-exact
          path: authorities/heavy-profile/aggregate.json
          if-no-files-found: error
          retention-days: 14
