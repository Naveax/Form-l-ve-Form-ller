name: predecessor-leaf weighted activity XOR MILP probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_weighted_activity_xor_milp.py'
      - '.github/workflows/predecessor-leaf-weighted-activity-xor-milp-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scipy
      - name: Reverify A/D second residue dependency
        run: python scripts/verify_v26_q138_predecessor_leaf_ad_second_dyadic_rank310.py
      - name: Reverify B/C first residue dependency
        run: python scripts/verify_v26_q138_predecessor_leaf_bc_first_dyadic_rank1160.py
      - name: Solve tight weighted XOR MILPs
        run: python scripts/probe_v26_q138_predecessor_leaf_weighted_activity_xor_milp.py
