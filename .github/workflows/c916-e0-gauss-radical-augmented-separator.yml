name: C916 e0 Gauss radical augmented separator

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_gauss_radical_augmented_separator.py'
      - 'scripts/verify_v26_q138_c916_e0_gauss_radical_augmented_separator_result.py'
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_gauss_radical_control.py'
      - 'scripts/probe_v26_q138_bc_e0_aggregate_signature_separator.py'
      - 'scripts/probe_v26_q138_c916_e0_complete_first_dyadic_fiber_geometry.py'
      - 'scripts/probe_v26_q138_c916_e0_same_support_integer_coefficients.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_E0_GAUSS_RADICAL_AUGMENTED_SEPARATOR.md'
      - '.github/workflows/c916-e0-gauss-radical-augmented-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-e0-gauss-radical-augmented-separator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify gauge-aware Gauss radical augmented separator
        run: python scripts/verify_v26_q138_c916_e0_gauss_radical_augmented_separator_result.py
