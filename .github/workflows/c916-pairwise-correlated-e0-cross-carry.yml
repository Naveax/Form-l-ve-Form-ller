name: C916 pairwise correlated e0 cross carry

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_pairwise_correlated_e0_cross_carry.py'
      - 'scripts/probe_v26_q138_c916_reachable_e0_own_third_carry.py'
      - 'scripts/probe_v26_q138_bc_e0_reachable_joint_sign_span.py'
      - 'scripts/probe_v26_q138_bc_e0_aggregate_signature_separator.py'
      - '.github/workflows/c916-pairwise-correlated-e0-cross-carry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-pairwise-correlated-e0-cross-carry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe C916 pairwise correlated e0 cross carry
        run: python scripts/probe_v26_q138_c916_pairwise_correlated_e0_cross_carry.py
