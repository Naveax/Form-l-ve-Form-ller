name: C916 E0 profile 251 fourth-level fallback exact

on:
  workflow_dispatch:
    inputs:
      parent_shard:
        description: 'Failed third-level parent shard'
        required: true
        type: choice
        options: ['1', '3']
      child_shard:
        description: 'Failed third-level child shard'
        required: true
        type: choice
        options: ['1', '3']
      grandchild_shard:
        description: 'Failed third-level grandchild shard'
        required: true
        type: choice
        options: ['1', '3']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.parent_shard }}-${{ inputs.child_shard }}-${{ inputs.grandchild_shard }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  fourth-shard:
    name: p${{ inputs.parent_shard }}-c${{ inputs.child_shard }}-g${{ inputs.grandchild_shard }}-s${{ matrix.fourth_shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fourth_shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check exact fourth-level shard runner
        run: >-
          python -m py_compile
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_fourth_level_shard_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_third_level_shard_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_context_exact.py
          scripts/_c916_all_current_weighted_context_engine.py
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - name: Exact fourth-level shard
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_fourth_level_shard_exact.py
          fourth
          --parent-shard ${{ inputs.parent_shard }}
          --child-shard ${{ inputs.child_shard }}
          --grandchild-shard ${{ inputs.grandchild_shard }}
          --fourth-shard ${{ matrix.fourth_shard }}
          --output authorities/profile-251-fourth/profile-251-parent-${{ inputs.parent_shard }}-child-${{ inputs.child_shard }}-grandchild-${{ inputs.grandchild_shard }}-fourth-${{ matrix.fourth_shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-profile251-fourth-p${{ inputs.parent_shard }}-c${{ inputs.child_shard }}-g${{ inputs.grandchild_shard }}-s${{ matrix.fourth_shard }}
          path: authorities/profile-251-fourth/*.json
          if-no-files-found: error
          retention-days: 14

  aggregate-grandchild:
    name: aggregate-p${{ inputs.parent_shard }}-c${{ inputs.child_shard }}-g${{ inputs.grandchild_shard }}
    needs: fourth-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-profile251-fourth-p${{ inputs.parent_shard }}-c${{ inputs.child_shard }}-g${{ inputs.grandchild_shard }}-s*
          path: authorities/profile-251-fourth
          merge-multiple: true
      - name: Aggregate exact fourth-level replacement
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_fourth_level_shard_exact.py
          aggregate-grandchild
          --parent-shard ${{ inputs.parent_shard }}
          --child-shard ${{ inputs.child_shard }}
          --grandchild-shard ${{ inputs.grandchild_shard }}
          --directory authorities/profile-251-fourth
          --output authorities/profile-251-fourth-aggregate/profile-251-parent-${{ inputs.parent_shard }}-child-${{ inputs.child_shard }}-grandchild-${{ inputs.grandchild_shard }}-fourth-aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-profile251-fourth-aggregate-p${{ inputs.parent_shard }}-c${{ inputs.child_shard }}-g${{ inputs.grandchild_shard }}
          path: authorities/profile-251-fourth-aggregate/*.json
          if-no-files-found: error
          retention-days: 14
