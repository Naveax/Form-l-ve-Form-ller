name: C916 e0 affine plus 7 ternaries 5 quads exact

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_affine_plus_7_ternaries_5_quads_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-affine-plus-7-ternaries-5-quads-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34525398437
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34636507636
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34648762168
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34713268307
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - name: Count complete affine support plus seven ternaries and five quads
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_affine_plus_7_ternaries_5_quads_exact.py
