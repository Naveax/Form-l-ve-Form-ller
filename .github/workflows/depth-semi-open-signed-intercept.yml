name: Semi-open signed depth law

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_semi_open_s3_signed_ac.py'
      - 'scripts/verify_v26_q138_depth_semi_open_signed_intercept.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_SEMI_OPEN_S3_SIGNED_AC_THEOREM.md'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_DEPTH_SEMI_OPEN_SIGNED_INTERCEPT_THEOREM.md'
      - '.github/workflows/depth-semi-open-signed-intercept.yml'
  workflow_dispatch:

concurrency:
  group: depth-semi-open-signed-main
  cancel-in-progress: true

jobs:
  exact-semi-open-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy
      - name: Verify central joint-sector dependency
        run: python scripts/verify_v26_q138_depth_joint_sector_law.py
      - name: Verify fully-open signed dependency
        run: python scripts/verify_v26_q138_fully_open_s3_local_signed_rank.py
      - name: Verify exact semi-open A/C ranks
        run: python scripts/verify_v26_q138_semi_open_s3_signed_ac.py
      - name: Verify improved depth law
        run: python scripts/verify_v26_q138_depth_semi_open_signed_intercept.py
