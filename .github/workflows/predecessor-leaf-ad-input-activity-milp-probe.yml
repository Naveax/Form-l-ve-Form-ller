name: predecessor-leaf A-D input activity MILP probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_ad_input_activity_milp.py'
      - '.github/workflows/predecessor-leaf-ad-input-activity-milp-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scipy
      - name: Reverify A/D second residue dependency
        run: python scripts/verify_v26_q138_predecessor_leaf_ad_second_dyadic_rank310.py
      - name: Solve exact A/D affine activity MILPs
        run: python scripts/probe_v26_q138_predecessor_leaf_ad_input_activity_milp.py
