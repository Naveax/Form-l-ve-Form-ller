name: B-C K1 correction quotients fresh
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: bc-k1-correction-quotients-fresh-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy
      - run: python scripts/probe_v26_q138_bc_k1_correction_quotients_fresh.py
# clean-receipt retrigger
