name: A-D third direct e2 weighted MILP
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scipy
      - run: python scripts/probe_v26_q138_ad_third_direct_e2_weighted_milp.py
