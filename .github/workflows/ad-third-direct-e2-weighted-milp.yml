name: A-D third direct e2 weighted MILP
on: [workflow_dispatch, push]
permissions:
  contents: read
  statuses: write
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy scipy
      - run: python scripts/probe_v26_q138_ad_third_direct_e2_weighted_milp.py | tee /tmp/admilp.txt
      - name: Publish exact result status when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DESC=$(grep '^STATUS_DESC=' /tmp/admilp.txt | sed 's/^STATUS_DESC=//')
          STATE=success
          if echo "$DESC" | grep -q 'incomplete'; then STATE=pending; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context='math/ad-third-direct-e2-milp' -f description="$DESC"
