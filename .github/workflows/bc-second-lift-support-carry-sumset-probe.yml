name: B-C second-lift support carry sumset probe
on:
  push:
    paths:
      - 'scripts/probe_v26_q138_bc_second_lift_support_carry_sumset.py'
      - '.github/workflows/bc-second-lift-support-carry-sumset-probe.yml'
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_second_lift_support_carry_sumset.py'
      - '.github/workflows/bc-second-lift-support-carry-sumset-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_bc_second_lift_support_carry_sumset.py
