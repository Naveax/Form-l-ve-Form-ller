name: C916 e0 physical triple value-image tail batch 10

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_physical_triple_value_image_tail.py'
      - '.github/workflows/c916-e0-first-dyadic-physical-triple-value-image-tail-batch10.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  exact-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target_index: [4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Exact next untested physical triple value image
        env:
          C916_PHYSICAL_TRIPLE_INDEX: ${{ matrix.target_index }}
          C916_PHYSICAL_TRIPLE_MAX_CELLS: '50000'
          C916_PHYSICAL_TRIPLE_MAX_PHASES: '14'
          C916_PHYSICAL_TRIPLE_MAX_WALSH_EVALS: '2000000'
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_physical_triple_value_image_tail.py
