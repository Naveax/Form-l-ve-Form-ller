name: C916 e0 first-dyadic phase-complete width148 tree

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_width148_tree.py'
      - '.github/workflows/c916-e0-first-dyadic-phase-complete-width148-tree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe explicit exact width148 linear tree
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_width148_tree.py
