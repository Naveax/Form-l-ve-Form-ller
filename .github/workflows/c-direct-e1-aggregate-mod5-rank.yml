name: C direct e1 aggregate mod5 rank probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c_direct_e1_*.py'
      - 'scripts/probe_v26_q138_bc_direct_e1_*.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_*.py'
      - '.github/workflows/c-direct-e1-aggregate-mod5-rank.yml'
  workflow_dispatch:
concurrency:
  group: c-direct-e1-aggregate-mod5-rank-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy python-flint
      - run: python scripts/probe_v26_q138_c_direct_e1_aggregate_mod5_rank.py
