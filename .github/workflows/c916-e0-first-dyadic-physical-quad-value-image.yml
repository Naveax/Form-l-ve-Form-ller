name: C916 e0 physical quadruple value-image scout

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_physical_quad_value_image.py'
      - '.github/workflows/c916-e0-first-dyadic-physical-quad-value-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  exact-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target_index: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Exact physical quadruple value image
        env:
          C916_PHYSICAL_QUAD_INDEX: ${{ matrix.target_index }}
          C916_PHYSICAL_QUAD_MAX_CELLS: '150000'
          C916_PHYSICAL_QUAD_MAX_PHASES: '18'
          C916_PHYSICAL_QUAD_MAX_WALSH_EVALS: '8000000'
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_physical_quad_value_image.py
