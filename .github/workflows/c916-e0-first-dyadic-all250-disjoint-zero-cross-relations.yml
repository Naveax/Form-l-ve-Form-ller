name: C916 e0 all-250 disjoint zero-cross relations

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_all250_disjoint_zero_cross_relations.py'
      - '.github/workflows/c916-e0-first-dyadic-all250-disjoint-zero-cross-relations.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Freeze all-250 disjoint projection zero-cross relations
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_all250_disjoint_zero_cross_relations.py
