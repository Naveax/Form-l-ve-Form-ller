name: C916 e0 all-four separator complete zero-cross

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_all4_separator_complete_zero_cross.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-all4-separator-complete-zero-cross.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact all-four separator complete zero-cross coupling
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_all4_separator_complete_zero_cross.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c916-four-separator-complete-authority
          path: artifacts/c916_e0_first_dyadic_four_separator_complete_authority.json
          if-no-files-found: ignore
