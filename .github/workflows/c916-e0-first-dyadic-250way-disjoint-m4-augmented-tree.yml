name: C916 e0 250-way disjoint-m4 augmented tree

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_disjoint_m4_augmented_tree.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-disjoint-m4-augmented-tree.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Rebuild exact 250-way tree with disjoint m4-m4 relations
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_disjoint_m4_augmented_tree.py
