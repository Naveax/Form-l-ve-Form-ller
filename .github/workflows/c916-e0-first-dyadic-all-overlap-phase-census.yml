name: C916 e0 first-dyadic all-overlap phase census

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_all_overlap_phase_census.py'
      - '.github/workflows/c916-e0-first-dyadic-all-overlap-phase-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe first-dyadic all-overlap phase census
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_all_overlap_phase_census.py
