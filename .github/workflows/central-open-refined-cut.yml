name: Central open refined terminal cut

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_central_open_refined_terminal_cut.py'
      - '.github/workflows/central-open-refined-cut.yml'
  workflow_dispatch:

jobs:
  central-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_q138_central_open_refined_terminal_cut.py
