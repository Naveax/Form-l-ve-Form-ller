name: B-C uniform half-lift third carry

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_uniform_half_lift_third_carry.py'
      - 'scripts/probe_v26_q138_bc_half_uniform_linear_state_relaxed_scalar.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_bc_second_residue_sign_span348_432.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_top_carry_cancellation.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_dyadic_descent92_121.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_bc_second_residue_support_frequency_nesting.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_bc_second_residue_rank812_972.py'
      - 'scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_high_correction_fourier.py'
      - 'scripts/probe_v26_q138_bc_direct_e1_exact_sector_cancellation.py'
      - 'scripts/probe_v26_q138_bc_second_residue_fixed_predecessor_specialization.py'
      - 'scripts/probe_v26_q138_bc_second_residue_reachable_predecessor_geometry.py'
      - 'scripts/probe_v26_q138_bc_second_residue_half_exact_right21.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_UNIFORM_HALF_LIFT_THIRD_CARRY_PROBE.md'
      - '.github/workflows/bc-uniform-half-lift-third-carry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-uniform-half-lift-third-carry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe uniform half-lift induced third carry
        run: python scripts/probe_v26_q138_bc_uniform_half_lift_third_carry.py
