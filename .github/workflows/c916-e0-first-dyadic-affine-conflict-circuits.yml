name: C916 e0 affine conflict circuit scout

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_affine_conflict_circuit_scout.py'
      - '.github/workflows/c916-e0-first-dyadic-affine-conflict-circuits.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-remaining-zero-cross-value-relation-authority
          run-id: 34823110470
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/zero
      - name: Reassert all 4005 exact pairwise value factors
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_complete_m4_pairwise_value_exact.py
      - name: Discover and recertify minimal affine conflict circuits
        env:
          C916_AFFINE_CIRCUIT_DOMAIN_SUM: '251'
          C916_AFFINE_CIRCUIT_QUOTA: '32'
          C916_AFFINE_CIRCUIT_MAX_RAW_BAD: '2000'
          C916_AFFINE_INTERN_MAX_CALLS: '500000'
          C916_AFFINE_INTERN_MAX_POLY_STATES: '900000'
          C916_AFFINE_INTERN_MAX_STATES: '1200000'
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_affine_conflict_circuit_scout.py
