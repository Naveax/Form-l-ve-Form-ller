name: C916 e0 250-way sampled cactus bound

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_250way_sampled_cactus_bound.py'
      - '.github/workflows/c916-e0-first-dyadic-250way-sampled-cactus-bound.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact sampled 250-way cactus CSP
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_250way_sampled_cactus_bound.py
