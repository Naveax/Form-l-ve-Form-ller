name: C916 e0 pair nonlinear value-image census

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_pair_value_image_census.py'
      - '.github/workflows/c916-e0-first-dyadic-pair-value-image-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Run exact frozen-pair nonlinear value-image census
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_pair_value_image_census.py
