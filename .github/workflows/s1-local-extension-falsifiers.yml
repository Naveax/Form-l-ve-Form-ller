name: S1 local extension falsifiers

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_s1_local_extension_falsifiers.py'
      - '.github/workflows/s1-local-extension-falsifiers.yml'
  workflow_dispatch:

jobs:
  s1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_q138_s1_local_extension_falsifiers.py
