name: C916 e0 first-dyadic group output pair dependency

on:
  pull_request:
    paths:
      - "scripts/probe_v26_q138_c916_e0_first_dyadic_group_output_pair_dependency.py"
      - "scripts/probe_v26_q138_c916_e0_first_dyadic_even_group_value_image_census.py"
      - "scripts/probe_v26_q138_c916_e0_first_dyadic_singleton_value_image_census.py"
      - "scripts/probe_v26_q138_c916_e0_post_gauss_physical_phase_common.py"
      - ".github/workflows/c916-e0-first-dyadic-group-output-pair-dependency.yml"

concurrency:
  group: c916-e0-first-dyadic-group-output-pair-dependency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact pairwise dependency across all 250 first-dyadic group outputs
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_group_output_pair_dependency.py
