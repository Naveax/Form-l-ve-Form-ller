name: B-C e0 fast issue capture
on:
  push:
    paths:
      - '.github/workflows/bc-e0-fast-issue-capture.yml'
permissions:
  contents: read
  issues: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run probe
        run: |
          set -euo pipefail
          { git rev-parse HEAD; python scripts/probe_v26_q138_bc_e0_correction_uniform_left_span.py; } | tee /tmp/e0.txt
      - name: Publish result issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "AUTO BC E0 FAST SPAN CERTIFICATE" --body-file /tmp/e0.txt
