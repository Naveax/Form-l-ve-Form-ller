name: C916 e0 m4 overlap nonzero-cross rare shapes

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_overlap_nonzero_cross_rare_shapes.py'
      - '.github/workflows/c916-e0-first-dyadic-m4-overlap-nonzero-cross-rare-shapes.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          path: authorities/m4
      - name: Measure all rare-shape overlap value relations
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_m4_overlap_nonzero_cross_rare_shapes.py
      - uses: actions/upload-artifact@v4
        with:
          name: c916-m4-overlap-nonzero-cross-rare-shapes
          path: artifacts/c916_e0_first_dyadic_m4_overlap_nonzero_cross_rare_shapes.json
          if-no-files-found: error
