name: Sharpened k9 convolution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_sharpened_k9_convolution.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_SHARPENED_K9_CONVOLUTION.md'
      - '.github/workflows/sharpened-k9-convolution.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sharpened four-leaf convolution
        run: python scripts/verify_v26_q138_sharpened_k9_convolution.py
