name: C916 full-tree evaluation width

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_full_tree_evaluation_width.py'
      - 'scripts/probe_v26_q138_c916_width65_edge_exact_fiber_count.py'
      - 'scripts/verify_v26_q138_c916_full_tree_evaluation_width_result.py'
      - 'scripts/probe_v26_q138_c916_quadratic_residual_separator.py'
      - 'scripts/probe_v26_q138_c916_worst_cut_all_fiber_residual_upper_bound.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_FULL_TREE_EVALUATION_WIDTH.md'
      - '.github/workflows/c916-full-tree-evaluation-width.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-full-tree-evaluation-width-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify C916 full-tree evaluation-width result
        run: python scripts/verify_v26_q138_c916_full_tree_evaluation_width_result.py
