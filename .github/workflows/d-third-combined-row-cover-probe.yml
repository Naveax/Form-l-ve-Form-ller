name: D third combined direct-correction row cover
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_d_third_combined_row_cover.py'
      - '.github/workflows/d-third-combined-row-cover-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_d_third_combined_row_cover.py
