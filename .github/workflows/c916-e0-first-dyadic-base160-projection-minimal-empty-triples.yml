name: C916 e0 base160 projection minimal-empty triples

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_base160_projection_minimal_empty_triples.py'
      - '.github/workflows/c916-e0-first-dyadic-base160-projection-minimal-empty-triples.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact minimal-empty base160 projection triples
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_base160_projection_minimal_empty_triples.py
