name: Constructive graph+leaf95 method optimality

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_double_round_ht88_method_optimal.py'
      - 'scripts/verify_v26_q138_double_round_constructive95.py'
      - 'scripts/verify_v26_q138_constructive_graph_leaf95_optimal.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_CONSTRUCTIVE_GRAPH_LEAF95_METHOD_OPTIMAL_THEOREM.md'
      - '.github/workflows/constructive-graph-leaf95-optimal.yml'
  workflow_dispatch:

jobs:
  graph-leaf95-optimal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet scipy
      - name: Verify exact cardinality graph minima
        run: python scripts/verify_v26_q138_double_round_ht88_method_optimal.py
      - name: Verify existing constructive95 upper bound
        run: python scripts/verify_v26_q138_double_round_constructive95.py
      - name: Verify graph+leaf95 method lower bound
        run: python scripts/verify_v26_q138_constructive_graph_leaf95_optimal.py
