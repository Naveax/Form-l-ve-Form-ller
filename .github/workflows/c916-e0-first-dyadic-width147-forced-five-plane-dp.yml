name: C916 e0 first-dyadic width147 forced five-plane DP

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_width147_forced_five_plane_dp.py'
      - '.github/workflows/c916-e0-first-dyadic-width147-forced-five-plane-dp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe forced five-plane exact upper-tree DP
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_phase_complete_width147_forced_five_plane_dp.py
