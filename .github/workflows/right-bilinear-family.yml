name: Right bilinear family span verifier

on:
  push:
    paths:
      - 'scripts/verify_v26_qr_q138_right_bilinear_family_span.py'
      - '.github/workflows/right-bilinear-family.yml'
  workflow_dispatch:

jobs:
  bilinear-span:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_qr_q138_right_bilinear_family_span.py
