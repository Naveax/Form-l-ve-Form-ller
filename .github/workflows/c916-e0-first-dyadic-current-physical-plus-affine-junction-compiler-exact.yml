name: C916 E0 current physical plus affine junction compiler exact

on:
  push:
    branches:
      - 'math/c916-current-physical-affine-junction-compiler-20260915'
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_current_physical_plus_affine_junction_compiler_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-current-physical-plus-affine-junction-compiler-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Compile exact physical plus affine junction tables
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_current_physical_plus_affine_junction_compiler_exact.py
