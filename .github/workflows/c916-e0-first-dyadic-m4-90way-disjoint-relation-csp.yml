name: C916 e0 m4 90-way disjoint relation CSP

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_90way_disjoint_relation_csp.py'
      - '.github/workflows/c916-e0-first-dyadic-m4-90way-disjoint-relation-csp.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact 90-way m4 disjoint-relation CSP
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_m4_90way_disjoint_relation_csp.py
