name: C916 e0 base160 width3 separator marginal

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_base160_width3_separator_marginal.py'
      - '.github/workflows/c916-e0-first-dyadic-base160-width3-separator-marginal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Count exact base160 width3 separator marginal
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_base160_width3_separator_marginal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c916-base160-width3-separator-authority
          path: artifacts/c916_e0_first_dyadic_base160_width3_separator_authority.json
          if-no-files-found: ignore
