name: C916 E0 tail3 expanded physical plus affine junction exact

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_tail3_expanded_physical_plus_affine_junction_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-tail3-expanded-physical-plus-affine-junction-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Syntax-check expanded combined verifier
        run: python -m py_compile scripts/verify_v26_q138_c916_e0_first_dyadic_tail3_expanded_physical_plus_affine_junction_exact.py
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tail3-quotient-*
          run-id: 35120066130
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/tail3-quotient
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Compile exact tail3-expanded physical plus affine junction
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
          C916_TAIL3_QUOTIENT_DIR: authorities/tail3-quotient
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_tail3_expanded_physical_plus_affine_junction_exact.py
