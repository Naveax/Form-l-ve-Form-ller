name: C916 e0 first-dyadic group output minimal linear factorization

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_group_output_minimal_linear_factorization.py'
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_group_output_minimal_linear_factorization_exact_overlap.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_group_output_minimal_linear_factorization_result.py'
      - '.github/workflows/c916-e0-first-dyadic-group-output-minimal-linear-factorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify frozen minimal linear factorization result
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_group_output_minimal_linear_factorization_result.py
