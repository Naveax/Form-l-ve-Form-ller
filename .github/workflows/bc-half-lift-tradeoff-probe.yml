name: B-C half lift tradeoff probe
on: [workflow_dispatch, push]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_predecessor_leaf_bc_half_lift_tradeoff.py
