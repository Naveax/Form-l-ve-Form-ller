name: C916 e0 complete m4 pairwise value exact

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_complete_m4_pairwise_relaxation_exact.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_complete_m4_pairwise_value_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-complete-m4-pairwise-relaxation-exact.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-remaining-zero-cross-value-relation-authority
          run-id: 34820737869
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/zero
      - name: Certify complete exact m4 pairwise value model
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_complete_m4_pairwise_value_exact.py
