name: C916 e0 m4 projection minimal-empty quadruples

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_m4_projection_minimal_empty_quadruples.py'
      - '.github/workflows/c916-e0-first-dyadic-m4-projection-minimal-empty-quadruples.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          path: authorities/m4
      - name: Count exact minimal-empty projection quadruples
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_m4_projection_minimal_empty_quadruples.py
