name: predecessor-leaf A-D parity rank3

on:
  push:
    paths:
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_PREDECESSOR_LEAF_AD_PARITY_RANK3.md'
      - 'scripts/verify_v26_q138_predecessor_leaf_ad_parity_rank3.py'
      - '.github/workflows/predecessor-leaf-ad-parity-rank3.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reverify dyadic descent dependency
        run: python scripts/verify_v26_q138_predecessor_leaf_dyadic_descent92_121.py
      - name: Verify A/D first parity rank3
        run: python scripts/verify_v26_q138_predecessor_leaf_ad_parity_rank3.py
