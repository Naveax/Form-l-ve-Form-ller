name: Signed83 two-factor d1

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_double_round_signed84_multisite.py'
      - 'scripts/verify_v26_q138_double_round_signed83_twofactor.py'
      - 'scripts/verify_v26_q138_signed_block1_explicit_factor.py'
      - 'scripts/verify_v26_q138_signed_block2_explicit_factor.py'
      - 'scripts/verify_v26_q138_signed_block2_physical_row_bridge.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_DOUBLE_ROUND_SIGNED83_TWOFACTOR_THEOREM.md'
      - '.github/workflows/double-round-signed83-twofactor.yml'
  workflow_dispatch:

jobs:
  signed83:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy
      - name: Verify special four-site rank96 dependency
        run: python scripts/verify_v26_q138_double_round_signed84_multisite.py
      - name: Verify explicit block1
        run: python scripts/verify_v26_q138_signed_block1_explicit_factor.py
      - name: Verify explicit block2
        run: python scripts/verify_v26_q138_signed_block2_explicit_factor.py
      - name: Verify block2 physical-row bridge
        run: python scripts/verify_v26_q138_signed_block2_physical_row_bridge.py
      - name: Verify generic four-site rank208 and final two-factor bound
        run: python scripts/verify_v26_q138_double_round_signed83_twofactor.py
