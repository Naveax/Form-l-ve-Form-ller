name: B-C half predecessor phase image rank probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_half_predecessor_phase_image_rank.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_HALF_PREDECESSOR_PHASE_IMAGE_RANK_PROBE.md'
      - '.github/workflows/bc-half-predecessor-phase-image-rank-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-half-predecessor-phase-image-rank-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/probe_v26_q138_bc_half_predecessor_phase_image_rank.py
