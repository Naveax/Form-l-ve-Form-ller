name: B-C half exact predecessor samples
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_half_exact_predecessor_samples.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_HALF_EXACT_PREDECESSOR_SAMPLE_PROBE.md'
      - '.github/workflows/bc-half-exact-predecessor-samples.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-half-exact-predecessor-samples-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/probe_v26_q138_bc_half_exact_predecessor_samples.py
