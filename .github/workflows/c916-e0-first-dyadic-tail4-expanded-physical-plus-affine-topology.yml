name: C916 E0 tail4 expanded physical plus affine topology

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_tail4_expanded_physical_plus_affine_topology.py'
      - '.github/workflows/c916-e0-first-dyadic-tail4-expanded-physical-plus-affine-topology.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Syntax-check topology-only verifier
        run: python -m py_compile scripts/verify_v26_q138_c916_e0_first_dyadic_tail4_expanded_physical_plus_affine_topology.py
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Certify tail4-expanded physical plus affine topology bounds
        env:
          C916_TAIL4_QUOTIENT_DIR: authorities/tail4-quotient
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_tail4_expanded_physical_plus_affine_topology.py
