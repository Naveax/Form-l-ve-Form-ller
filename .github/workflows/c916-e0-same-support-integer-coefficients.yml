name: C916 e0 same-support integer coefficients

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_same_support_integer_coefficients.py'
      - 'scripts/probe_v26_q138_bc_e0_quadratic_scalar_refinement.py'
      - 'scripts/probe_v26_q138_bc_direct_e1_exact_sector_cancellation.py'
      - '.github/workflows/c916-e0-same-support-integer-coefficients.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-e0-same-support-integer-coefficients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact same-support integer coefficients
        run: python scripts/probe_v26_q138_c916_e0_same_support_integer_coefficients.py
