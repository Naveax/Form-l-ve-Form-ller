name: C916 E0 current physical plus affine treewidth exact

on:
  push:
    branches:
      - 'math/c916-current-physical-affine-treewidth9-20260915'
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_current_physical_plus_affine_treewidth_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-current-physical-plus-affine-treewidth-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Verify exact combined higher-order treewidth
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_current_physical_plus_affine_treewidth_exact.py
