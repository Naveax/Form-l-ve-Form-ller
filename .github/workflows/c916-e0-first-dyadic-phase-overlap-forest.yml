name: C916 e0 first-dyadic phase overlap forest

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_phase_overlap_forest.py'
      - '.github/workflows/c916-e0-first-dyadic-phase-overlap-forest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe first-dyadic phase overlap forest
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_phase_overlap_forest.py
