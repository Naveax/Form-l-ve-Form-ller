name: B-C direct e1 exact sector cancellation probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_direct_e1_*.py'
      - 'scripts/verify_v26_q138_predecessor_leaf_*.py'
      - '.github/workflows/bc-direct-e1-exact-sector-cancellation-probe.yml'
  workflow_dispatch:
concurrency:
  group: bc-direct-e1-exact-sector-cancellation-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_v26_q138_bc_direct_e1_exact_sector_cancellation.py
