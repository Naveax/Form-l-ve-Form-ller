name: B-C second residue e0 joint enumeration
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_second_residue_e0_joint_enumeration.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_SECOND_RESIDUE_E0_JOINT_ENUMERATION_PROBE.md'
      - '.github/workflows/bc-second-residue-e0-joint-enumeration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-second-residue-e0-joint-enumeration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/probe_v26_q138_bc_second_residue_e0_joint_enumeration.py
