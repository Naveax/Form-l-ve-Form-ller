name: C916 E0 tail3 expanded physical treewidth6 exact

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_tail3_expanded_physical_treewidth6_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-tail3-expanded-physical-treewidth6-exact.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check exact treewidth verifier
        run: python -m py_compile scripts/verify_v26_q138_c916_e0_first_dyadic_tail3_expanded_physical_treewidth6_exact.py
      - name: Prove exact treewidth 6
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_tail3_expanded_physical_treewidth6_exact.py
