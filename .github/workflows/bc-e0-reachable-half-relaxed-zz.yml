name: B-C e0 reachable half relaxed ZZ 748-916

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_bc_e0_reachable_half_relaxed_zz.py'
      - 'scripts/verify_v26_q138_bc_e0_reachable_half_relaxed_zz748_916.py'
      - 'scripts/probe_v26_q138_bc_e0_reachable_joint_sign_span.py'
      - 'scripts/probe_v26_q138_bc_half_uniform_linear_state_relaxed_scalar.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_BC_E0_REACHABLE_HALF_RELAXED_ZZ748_916.md'
      - '.github/workflows/bc-e0-reachable-half-relaxed-zz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - run: python scripts/verify_v26_q138_bc_e0_reachable_half_relaxed_zz748_916.py
