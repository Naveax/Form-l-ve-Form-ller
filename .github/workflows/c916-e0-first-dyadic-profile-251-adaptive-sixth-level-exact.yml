name: C916 E0 profile 251 adaptive sixth-level exact

on:
  pull_request:
    paths:
      - '.github/workflows/c916-e0-first-dyadic-profile-251-adaptive-sixth-level-exact.yml'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_sixth_level_fanin_exact.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  sixth-child:
    name: sixth-${{ matrix.path.label }}-child-${{ matrix.next_shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        path:
          - { indices: '1,1,1,1,2', label: '1-1-1-1-2' }
          - { indices: '1,1,1,1,3', label: '1-1-1-1-3' }
          - { indices: '1,1,1,3,2', label: '1-1-1-3-2' }
          - { indices: '1,1,1,3,3', label: '1-1-1-3-3' }
          - { indices: '1,1,3,1,2', label: '1-1-3-1-2' }
          - { indices: '1,1,3,1,3', label: '1-1-3-1-3' }
          - { indices: '1,1,3,3,2', label: '1-1-3-3-2' }
          - { indices: '1,1,3,3,3', label: '1-1-3-3-3' }
          - { indices: '1,3,1,1,2', label: '1-3-1-1-2' }
          - { indices: '1,3,1,1,3', label: '1-3-1-1-3' }
          - { indices: '1,3,1,3,2', label: '1-3-1-3-2' }
          - { indices: '1,3,1,3,3', label: '1-3-1-3-3' }
          - { indices: '1,3,3,1,2', label: '1-3-3-1-2' }
          - { indices: '1,3,3,1,3', label: '1-3-3-1-3' }
          - { indices: '1,3,3,3,2', label: '1-3-3-3-2' }
          - { indices: '1,3,3,3,3', label: '1-3-3-3-3' }
          - { indices: '3,1,1,1,2', label: '3-1-1-1-2' }
          - { indices: '3,1,1,1,3', label: '3-1-1-1-3' }
          - { indices: '3,1,1,3,2', label: '3-1-1-3-2' }
          - { indices: '3,1,1,3,3', label: '3-1-1-3-3' }
          - { indices: '3,1,3,1,2', label: '3-1-3-1-2' }
          - { indices: '3,1,3,1,3', label: '3-1-3-1-3' }
          - { indices: '3,1,3,3,2', label: '3-1-3-3-2' }
          - { indices: '3,1,3,3,3', label: '3-1-3-3-3' }
          - { indices: '3,3,1,1,2', label: '3-3-1-1-2' }
          - { indices: '3,3,1,1,3', label: '3-3-1-1-3' }
          - { indices: '3,3,1,3,2', label: '3-3-1-3-2' }
          - { indices: '3,3,1,3,3', label: '3-3-1-3-3' }
          - { indices: '3,3,3,1,2', label: '3-3-3-1-2' }
          - { indices: '3,3,3,1,3', label: '3-3-3-1-3' }
          - { indices: '3,3,3,3,2', label: '3-3-3-3-2' }
          - { indices: '3,3,3,3,3', label: '3-3-3-3-3' }
        next_shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check adaptive exact runner
        run: >-
          python -m py_compile
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_path_shard_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_sixth_level_fanin_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_context_exact.py
          scripts/_c916_all_current_weighted_context_engine.py
      - run: python -m pip install --quiet sympy==1.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-current-physical-factor-*
          run-id: 34952229238
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/current-physical-factors
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: c916-base160-width3-separator-authority
          run-id: 34607657664
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/base
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-subset-pair-relation-authority
          run-id: 34612599814
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/subset
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-equal-pair-relation-authority
          run-id: 34617809287
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/equal
      - uses: actions/download-artifact@v4
        with:
          name: c916-m4-full-overlap-sign-reflection-quotient-authority
          run-id: 34820011973
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/overlap
      - name: Exact adaptive sixth child
        env:
          C916_CURRENT_PHYSICAL_FACTOR_DIR: authorities/current-physical-factors
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_path_shard_exact.py
          child
          --path '${{ matrix.path.indices }}'
          --next-shard ${{ matrix.next_shard }}
          --output authorities/profile-251-sixth/profile-251-path-${{ matrix.path.label }}-child-${{ matrix.next_shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-profile251-sixth-${{ matrix.path.label }}-child-${{ matrix.next_shard }}
          path: authorities/profile-251-sixth/*.json
          if-no-files-found: error
          retention-days: 14

  aggregate-sixth:
    name: aggregate-sixth-${{ matrix.path.label }}
    needs: sixth-child
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        path:
          - { indices: '1,1,1,1,2', label: '1-1-1-1-2' }
          - { indices: '1,1,1,1,3', label: '1-1-1-1-3' }
          - { indices: '1,1,1,3,2', label: '1-1-1-3-2' }
          - { indices: '1,1,1,3,3', label: '1-1-1-3-3' }
          - { indices: '1,1,3,1,2', label: '1-1-3-1-2' }
          - { indices: '1,1,3,1,3', label: '1-1-3-1-3' }
          - { indices: '1,1,3,3,2', label: '1-1-3-3-2' }
          - { indices: '1,1,3,3,3', label: '1-1-3-3-3' }
          - { indices: '1,3,1,1,2', label: '1-3-1-1-2' }
          - { indices: '1,3,1,1,3', label: '1-3-1-1-3' }
          - { indices: '1,3,1,3,2', label: '1-3-1-3-2' }
          - { indices: '1,3,1,3,3', label: '1-3-1-3-3' }
          - { indices: '1,3,3,1,2', label: '1-3-3-1-2' }
          - { indices: '1,3,3,1,3', label: '1-3-3-1-3' }
          - { indices: '1,3,3,3,2', label: '1-3-3-3-2' }
          - { indices: '1,3,3,3,3', label: '1-3-3-3-3' }
          - { indices: '3,1,1,1,2', label: '3-1-1-1-2' }
          - { indices: '3,1,1,1,3', label: '3-1-1-1-3' }
          - { indices: '3,1,1,3,2', label: '3-1-1-3-2' }
          - { indices: '3,1,1,3,3', label: '3-1-1-3-3' }
          - { indices: '3,1,3,1,2', label: '3-1-3-1-2' }
          - { indices: '3,1,3,1,3', label: '3-1-3-1-3' }
          - { indices: '3,1,3,3,2', label: '3-1-3-3-2' }
          - { indices: '3,1,3,3,3', label: '3-1-3-3-3' }
          - { indices: '3,3,1,1,2', label: '3-3-1-1-2' }
          - { indices: '3,3,1,1,3', label: '3-3-1-1-3' }
          - { indices: '3,3,1,3,2', label: '3-3-1-3-2' }
          - { indices: '3,3,1,3,3', label: '3-3-1-3-3' }
          - { indices: '3,3,3,1,2', label: '3-3-3-1-2' }
          - { indices: '3,3,3,1,3', label: '3-3-3-1-3' }
          - { indices: '3,3,3,3,2', label: '3-3-3-3-2' }
          - { indices: '3,3,3,3,3', label: '3-3-3-3-3' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-profile251-sixth-${{ matrix.path.label }}-child-*
          path: authorities/profile-251-sixth
          merge-multiple: true
      - name: Aggregate exact sixth-level replacement
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_sixth_level_fanin_exact.py
          aggregate-sixth
          --path '${{ matrix.path.indices }}'
          --directory authorities/profile-251-sixth
          --output authorities/profile-251-sixth-aggregate/profile-251-path-${{ matrix.path.label }}-aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-profile251-sixth-${{ matrix.path.label }}-aggregate
          path: authorities/profile-251-sixth-aggregate/*.json
          if-no-files-found: error
          retention-days: 14

  final:
    name: adaptive-sixth-profile-251-final
    needs: aggregate-sixth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check exact sixth-level fan-in
        run: >-
          python -m py_compile
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_sixth_level_fanin_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_fifth_level_fanin_exact.py
          scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_mixed_depth_fanin_exact.py
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-all-current-weighted-profile-251-shard-*
          run-id: 35118377359
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/profile-251-first-level
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-all-current-weighted-profile-251-parent-*-child-*
          run-id: 35321639122
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/profile-251-nested
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-profile251-third-level-parent-*-child-*-grandchild-*
          run-id: 35571022310
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/profile-251-third
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-profile251-fourth-level-parent-*-child-*-grandchild-*-fourth-*
          run-id: 35610863648
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/profile-251-fourth
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-profile251-adaptive-*-child-*
          run-id: 35736067323
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/profile-251-fifth-success
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: c916-profile251-sixth-*-aggregate
          path: authorities/profile-251-sixth-aggregate
          merge-multiple: true
      - name: Exact mixed fifth/sixth final fan-in
        run: >-
          python scripts/verify_v26_q138_c916_e0_first_dyadic_all_current_physical_weighted_profile_251_adaptive_sixth_level_fanin_exact.py
          final
          --first-level-directory authorities/profile-251-first-level
          --nested-directory authorities/profile-251-nested
          --direct-third-directory authorities/profile-251-third
          --direct-fourth-directory authorities/profile-251-fourth
          --fifth-directory authorities/profile-251-fifth-success
          --sixth-directory authorities/profile-251-sixth-aggregate
          --fifth-replacement-directory authorities/profile-251-fifth-replacements
          --grandchild-replacement-directory authorities/profile-251-grandchild-replacements
          --output authorities/c916-all-current-weighted-profile-251-adaptive-sixth-final-exact.json
      - uses: actions/upload-artifact@v4
        with:
          name: c916-all-current-weighted-profile-251-adaptive-sixth-final-exact
          path: authorities/c916-all-current-weighted-profile-251-adaptive-sixth-final-exact.json
          if-no-files-found: error
          retention-days: 14
