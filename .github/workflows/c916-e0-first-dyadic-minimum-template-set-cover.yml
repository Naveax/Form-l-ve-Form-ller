name: C916 e0 first-dyadic minimum template set cover

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_minimum_template_set_cover.py'
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_minimum_template_set_cover_result.py'
      - 'research/v26/recovered-bit-puncturing-dac/V26_Q138_C916_E0_FIRST_DYADIC_MINIMUM_TEMPLATE_SET_COVER.md'
      - '.github/workflows/c916-e0-first-dyadic-minimum-template-set-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Verify exact minimum maximal-support template set cover
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_minimum_template_set_cover_result.py
