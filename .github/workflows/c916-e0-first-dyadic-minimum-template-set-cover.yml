name: C916 e0 first-dyadic minimum template set cover

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_minimum_template_set_cover.py'
      - '.github/workflows/c916-e0-first-dyadic-minimum-template-set-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe exact minimum maximal-support template set cover
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_minimum_template_set_cover.py
