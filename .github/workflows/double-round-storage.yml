name: Double-round storage accounting

on:
  push:
    paths:
      - 'scripts/verify_v26_q138_double_round_storage_accounting.py'
      - '.github/workflows/double-round-storage.yml'
  workflow_dispatch:

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_v26_q138_double_round_storage_accounting.py
