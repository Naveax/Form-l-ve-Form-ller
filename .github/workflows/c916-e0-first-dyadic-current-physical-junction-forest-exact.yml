name: C916 E0 current physical junction forest exact

on:
  pull_request:
    paths:
      - 'scripts/verify_v26_q138_c916_e0_first_dyadic_current_physical_junction_forest_exact.py'
      - '.github/workflows/c916-e0-first-dyadic-current-physical-junction-forest-exact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c916-four-separator-complete-authority
          run-id: 34605915580
          github-token: ${{ github.token }}
          repository: Naveax/Form-l-ve-Form-ller
          path: authorities/m4
      - name: Verify exact junction forest and state-space bounds
        run: python scripts/verify_v26_q138_c916_e0_first_dyadic_current_physical_junction_forest_exact.py
