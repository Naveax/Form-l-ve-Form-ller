name: A-D coverage-greedy FWHT probe
on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_ad_third_coverage_greedy_fwht.py'
      - '.github/workflows/ad-coverage-greedy-fwht-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python scripts/probe_v26_q138_ad_third_coverage_greedy_fwht.py
