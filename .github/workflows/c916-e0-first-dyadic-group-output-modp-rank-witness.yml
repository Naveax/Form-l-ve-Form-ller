name: C916 e0 first-dyadic group output mod-p rank witness

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_group_output_modp_rank_witness.py'
      - '.github/workflows/c916-e0-first-dyadic-group-output-modp-rank-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe deterministic mod-p full-rank physical evaluation witness
        run: python scripts/probe_v26_q138_c916_e0_first_dyadic_group_output_modp_rank_witness.py
