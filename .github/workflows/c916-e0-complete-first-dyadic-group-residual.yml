name: C916 e0 complete first dyadic group residual

on:
  pull_request:
    paths:
      - 'scripts/probe_v26_q138_c916_e0_complete_first_dyadic_group_residual.py'
      - 'scripts/probe_v26_q138_c916_e0_first_dyadic_pair_residual.py'
      - 'scripts/probe_v26_q138_c916_e0_same_support_integer_coefficients.py'
      - '.github/workflows/c916-e0-complete-first-dyadic-group-residual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c916-e0-complete-first-dyadic-group-residual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sympy==1.14.0
      - name: Probe complete first dyadic group residual
        run: python scripts/probe_v26_q138_c916_e0_complete_first_dyadic_group_residual.py
