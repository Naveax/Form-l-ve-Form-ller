name: predecessor-leaf B-C second residue high correction Fourier probe

on:
  push:
    paths:
      - 'scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_high_correction_fourier.py'
      - '.github/workflows/predecessor-leaf-bc-second-residue-high-correction-fourier-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe high-weight correction Fourier structure
        run: python scripts/probe_v26_q138_predecessor_leaf_bc_second_residue_high_correction_fourier.py
